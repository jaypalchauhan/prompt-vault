<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Prompt Vault</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Prompt Vault</h1>
      <button id="add-btn" class="primary" title="Add a new prompt">+ Add</button>
    </header>

    <input id="search" type="search" placeholder="Search prompts…" autocomplete="off" />

    <form id="editor" class="editor hidden">
      <input id="editor-title" type="text" placeholder="Title (shown in the dropdown)" maxlength="60" required />
      <textarea id="editor-body" placeholder="Prompt text…" rows="6" required></textarea>
      <div class="editor-actions">
        <button type="submit" class="primary">Save</button>
        <button type="button" id="editor-cancel">Cancel</button>
      </div>
    </form>

    <ul id="prompt-list" class="prompt-list"></ul>
    <p id="empty-note" class="empty-note hidden">No prompts yet — click <strong>+ Add</strong> to save your first one.</p>

    <footer class="footer">
      <button id="export-btn" title="Download all prompts as JSON">Export</button>
      <button id="import-btn" title="Import prompts from a JSON file">Import</button>
      <input id="import-file" type="file" accept="application/json" class="hidden" />
      <span id="status" class="status" role="status"></span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
